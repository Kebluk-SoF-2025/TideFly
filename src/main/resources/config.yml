# +------------------------------------------------------+ #
# |               Storage Configuration                  | #
# +------------------------------------------------------+ #

storage:
  # The storage type to use. Options:
  # Remote databases:
  #  - MySQL
  #  - MariaDB
  #  - PostgreSQL
  #  - MongoDB
  # Local Storage:
  #  - SQLite
  #  - JSON
  type: json

  # MySQL configuration
  mysql:
    # The default port will be used if not specified. (3306 for MySQL/MariaDB, 5432 for PostgreSQL, 27017 for MongoDB)
    # If you want to use a different port, specify it in "host:port" format.
    host: localhost
    database: tidefly
    username: root
    password: ''

  # SQLite configuration
  sqlite:
    file: data/tidefly.db


# !!! DO NOT TOUCH THIS !!! #
version: 1
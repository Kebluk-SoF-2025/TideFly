# +------------------------------------------------------+ #
# |                  Internal Messages                   | #
# +------------------------------------------------------+ #

reloading: "<grey>Reloading TideFly..."
reloaded: "<green>TideFly reloaded successfully!"

no-permission: "<red>You do not have permission to perform this action!"
player-only: "<red>This command can only be executed by a player!"


# +------------------------------------------------------+ #
# |                   General Messages                   | #
# +------------------------------------------------------+ #

fly-enabled: "<green>Success! Fly mode enabled!"
fly-disabled: "<green>Success! Fly mode disabled!"
fly-enabled-other: "<green>Fly mode enabled for <player>!"
fly-disabled-other: "<green>Fly mode disabled for <player>!"
fly-already-enabled: "<red>Fly mode is already enabled!"
fly-already-disabled: "<red>Fly mode is already disabled!"


# +------------------------------------------------------+ #
# |                     Command Help                     | #
# +------------------------------------------------------+ #

fly-on: "/fly on - Enables fly mode."
fly-off: "/fly off - Disables fly mode."
fly-toggle: "/fly toggle - Toggles fly mode."
fly-help: "/fly help - Displays this help message."
fly-speed: "/fly speed <speed> - Sets your fly speed (0.1 to 10)."
fly-pay: "/fly pay <player> <amount> - Gives another player you fly time."


# !!! DO NOT TOUCH THIS !!! #
version: 1